const Router = {
  routes: {
    '#/':              { title: 'Dashboard',    breadcrumb: 'Visão geral',   nav: 'dashboard', render: viewDashboard,  bind: null },
    '#/insumos':       { title: 'Insumos',      breadcrumb: 'Cadastros',     nav: 'insumos',   render: viewInsumos,    bind: bindInsumosView },
    '#/mao-obra':      { title: 'Mão de obra',  breadcrumb: 'Cadastros',     nav: 'mo',        render: viewMaoObra,    bind: null },
    '#/propostas':     { title: 'Propostas',    breadcrumb: 'Precificador',  nav: 'propostas', render: viewPropostas,  bind: bindPropostasView },
    '#/propostas/nova':{ title: 'Nova proposta',breadcrumb: 'Propostas / Nova', nav: 'propostas', render: viewPropostaEdit, bind: bindPropostaEdit },
    '#/licitacoes':    { title: 'Licitações',   breadcrumb: 'Licitações',    nav: 'licitacoes',render: viewLicitacoes, bind: bindLicitacoesView },
    '#/licitacoes/nova':{ title:'Nova licitação',breadcrumb:'Licitações / Nova',nav:'licitacoes',render: viewLicitacaoEdit,bind: bindLicitacaoEdit },
    '#/config':        { title: 'Configurações',breadcrumb: 'Sistema',       nav: 'config',    render: viewConfig,     bind: bindConfigView },
    '#/usuarios':      { title: 'Usuários',     breadcrumb: 'Sistema',       nav: 'usuarios',  render: viewUsuarios,   bind: bindUsuariosView }
  },

  current: '#/',

  navigate(hash) {
    window.location.hash = hash || '#/';
  },

  render() {
    let hash = window.location.hash || '#/';

    // rotas dinâmicas
    // #/propostas/:id        -> editar
    // #/propostas/:id/print  -> imprimir
    // #/licitacoes/:id       -> editar licitação
    let route = this.routes[hash];
    let propostaId = null;
    let modePrint = false;
    let licitacaoId = null;

    if (!route) {
      const m1 = hash.match(/^#\/propostas\/([\w]+)\/print$/);
      const m2 = hash.match(/^#\/propostas\/([\w]+)$/);
      const m3 = hash.match(/^#\/licitacoes\/([\w]+)$/);
      if (m1) {
        propostaId = m1[1];
        modePrint = true;
      } else if (m2) {
        propostaId = m2[1];
      } else if (m3 && m3[1] !== 'nova') {
        licitacaoId = m3[1];
      }
    }

    let title, breadcrumb, navKey, html;

    if (licitacaoId) {
      // Carrega licitação atual
      const lic = Store.licitacoes.get(licitacaoId);
      if (!lic) {
        title = 'Licitação não encontrada';
        breadcrumb = 'Licitações';
        navKey = 'licitacoes';
        html = `<div class="empty"><h3>Licitação não encontrada</h3><p>Talvez tenha sido excluída. Volte para <a href="#/licitacoes">a lista</a></p></div>`;
      } else {
        _licAtual = JSON.parse(JSON.stringify(lic));
        title = 'Licitação ' + (lic.numero || '');
        breadcrumb = 'Licitações / Editar';
        navKey = 'licitacoes';
        html = viewLicitacaoEdit();
      }
    } else if (propostaId) {
      if (modePrint) {
        const p = Store.propostas.get(propostaId);
        title = 'Proposta ' + (p?.numero || '');
        breadcrumb = 'Propostas / Visualizar';
        navKey = 'propostas';
        html = viewPropostaPrint(p);
      } else {
        const atual = _getPropostaAtual();
        if (!atual || atual.id !== propostaId) {
          carregarProposta(propostaId);
        }
        title = 'Editar proposta ' + (_getPropostaAtual()?.numero || '');
        breadcrumb = 'Propostas / Editar';
        navKey = 'propostas';
        html = viewPropostaEdit();
      }
    } else if (route) {
      if (hash === '#/propostas/nova') {
        const atual = _getPropostaAtual();
        if (!atual || atual.id) {
          carregarProposta(null);
        }
      } else if (this.current && this.current.startsWith('#/propostas/') && hash !== this.current) {
        carregarProposta(null);
        window._clearPropostaAtual && window._clearPropostaAtual();
      } else if (hash === '#/licitacoes/nova') {
        // reseta editor de licitação
        _licAtual = null;
      } else if (this.current && this.current.startsWith('#/licitacoes/') && hash !== this.current && hash !== '#/licitacoes/nova') {
        // saiu da rota de licitação → limpa
        _licAtual = null;
      }
      title = route.title;
      breadcrumb = route.breadcrumb;
      navKey = route.nav;
      html = route.render();
    } else {
      title = '404';
      breadcrumb = 'Página não encontrada';
      html = `<div class="empty"><h3>Página não encontrada</h3><p>Volte para o <a href="#/">início</a></p></div>`;
    }

    // header
    document.getElementById('page-title').textContent = title;
    document.getElementById('page-breadcrumb').textContent = breadcrumb;

    // nav active
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.nav === navKey);
    });

    // content
    document.getElementById('content').innerHTML = html;

    // bindings
    if (hash === '#/propostas/nova' || propostaId && !modePrint) {
      bindPropostaEdit();
    } else if (hash === '#/licitacoes/nova' || licitacaoId) {
      bindLicitacaoEdit();
    } else if (route?.bind) {
      route.bind();
    }

    // Aplicar permissões
    applyPermissionVisibility();

    this.current = hash;
  }
};

function applyPermissionVisibility() {
  if (Store.mode !== 'firebase') return;
  document.querySelectorAll('[data-action]').forEach(el => {
    const action = el.dataset.action;
    const perm = ACTION_PERMS[action];
    if (perm && !FB.can(perm)) {
      el.style.display = 'none';
    }
  });

  // Inputs e selects em modo "só leitura" para visualizadores em telas críticas
  if (!FB.can('canEditInsumos') && (location.hash === '#/insumos' || location.hash.startsWith('#/propostas'))) {
    // ok — botões já escondidos. Inputs de proposta dependem de canEditProposta
  }
  if (!FB.can('canEditProposta') && location.hash.match(/^#\/propostas\/[^/]+$/) && !location.hash.endsWith('/print')) {
    document.querySelectorAll('#content input, #content select, #content textarea').forEach(el => {
      el.disabled = true;
    });
  }
  if (!FB.can('canChangeMarginTax') && location.hash.match(/^#\/propostas\/[^/]+$/)) {
    document.querySelectorAll('[data-prop="margem"], [data-prop="impostos"]').forEach(el => el.disabled = true);
  }
  if (!FB.can('canEditConfig') && location.hash === '#/config') {
    document.querySelectorAll('#content input, #content select').forEach(el => el.disabled = true);
  }
}

// Helper de permissão: em modo local sempre permite; em modo firebase consulta FB
const Perm = {
  can(perm) {
    if (Store.mode === 'local') return true;
    return FB.can(perm);
  }
};

// Mapa de actions → permissão necessária
const ACTION_PERMS = {
  'novo-insumo':       'canEditInsumos',
  'editar-insumo':     'canEditInsumos',
  'excluir-insumo':    'canEditInsumos',
  'novo-mo':           'canEditMO',
  'editar-mo':         'canEditMO',
  'excluir-mo':        'canEditMO',
  'nova-proposta':     'canCreateProposta',
  'duplicar-proposta': 'canCreateProposta',
  'excluir-proposta':  'canDeleteProposta',
  'add-item':          'canEditProposta',
  'del-item':          'canEditProposta',
  'add-mo':            'canEditProposta',
  'del-mo':            'canEditProposta',
  'salvar-proposta':   'canEditProposta',
  'nova-licitacao':    'canCreateProposta',
  'salvar-licitacao':  'canEditProposta',
  'excluir-licitacao': 'canDeleteProposta',
  'reset-tudo':        'canManageUsers',
  'user-activate':     'canManageUsers',
  'user-deactivate':   'canManageUsers'
};

function bindGlobalActions() {
  document.addEventListener('click', (e) => {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;
    const id = target.dataset.id;
    const idx = target.dataset.idx;

    // Checa permissão
    const requiredPerm = ACTION_PERMS[action];
    if (requiredPerm && !Perm.can(requiredPerm)) {
      toast('Você não tem permissão para esta ação', 'danger');
      e.preventDefault(); e.stopPropagation();
      return;
    }

    switch (action) {
      // navegação
      case 'nova-proposta':       Router.navigate('#/propostas/nova'); break;
      case 'abrir-proposta':      Router.navigate('#/propostas/' + id); break;
      case 'imprimir-proposta':   imprimirPropostaAtual(); break;
      case 'voltar-edit':         Router.navigate('#/propostas/' + id); break;

      // insumos
      case 'novo-insumo':         openInsumoModal(); break;
      case 'editar-insumo':       openInsumoModal(id); break;
      case 'excluir-insumo':
        confirmDialog('Excluir este insumo? Esta ação não pode ser desfeita.', () => {
          Store.insumos.remove(id); toast('Insumo excluído'); Router.render();
        });
        break;

      // mão de obra
      case 'novo-mo':             openMaoObraModal(); break;
      case 'editar-mo':           openMaoObraModal(id); break;
      case 'excluir-mo':
        confirmDialog('Excluir esta função? Esta ação não pode ser desfeita.', () => {
          Store.maoObra.remove(id); toast('Função excluída'); Router.render();
        });
        break;

      // propostas - editor
      case 'add-item':            adicionarItem(); break;
      case 'del-item':            removerItem(parseInt(idx)); break;
      case 'add-mo':              adicionarMO(); break;
      case 'del-mo':              removerMO(parseInt(idx)); break;
      case 'salvar-proposta':     salvarProposta(); break;

      // propostas - lista
      case 'duplicar-proposta':
        const orig = Store.propostas.get(id);
        if (orig) {
          const novo = JSON.parse(JSON.stringify(orig));
          novo.id = null; novo.numero = ''; novo.status = 'rascunho';
          Store.propostas.add(novo);
          toast('Proposta duplicada — ' + novo.numero);
          Router.render();
        }
        break;
      case 'excluir-proposta':
        confirmDialog('Excluir esta proposta? Esta ação não pode ser desfeita.', () => {
          Store.propostas.remove(id); toast('Proposta excluída'); Router.render();
        });
        break;

      // licitações
      case 'nova-licitacao':
        _licAtual = null;
        Router.navigate('#/licitacoes/nova');
        break;
      case 'abrir-licitacao':
        Router.navigate('#/licitacoes/' + id);
        break;
      case 'salvar-licitacao':
        salvarLicitacao();
        break;
      case 'voltar-licitacoes':
        Router.navigate('#/licitacoes');
        break;
      case 'excluir-licitacao':
        confirmDialog('Excluir esta licitação? Esta ação não pode ser desfeita.', () => {
          Store.licitacoes.remove(id);
          toast('Licitação excluída');
          Router.navigate('#/licitacoes');
        });
        break;

      // backup
      case 'export-tudo':         exportarTudo(); break;
      case 'export-insumos':      exportarInsumos(); break;
      case 'import-tudo':         importarTudo(); break;
      case 'reset-tudo':
        confirmDialog('Restaurar dados iniciais? <strong>Tudo será apagado</strong> e voltará ao seed da planilha base.', () => {
          Store.reset(); toast('Dados restaurados'); Router.navigate('#/'); Router.render();
        });
        break;

      // usuários (admin)
      case 'user-activate':
        (async () => {
          try {
            await FB.updateUserRole(target.dataset.uid, { active: true });
            toast('Usuário aprovado');
            _usersCache = await FB.listUsers();
            Router.render();
          } catch (e) { toast('Erro: ' + e.message, 'danger'); }
        })();
        break;
      case 'user-deactivate':
        confirmDialog('Desativar este usuário? Ele perderá o acesso ao sistema.', async () => {
          try {
            await FB.updateUserRole(target.dataset.uid, { active: false });
            toast('Usuário desativado');
            _usersCache = await FB.listUsers();
            Router.render();
          } catch (e) { toast('Erro: ' + e.message, 'danger'); }
        });
        break;
    }
  });
}

function imprimirPropostaAtual() {
  const p = _getPropostaAtual();
  if (!p) return;
  // salva primeiro se ainda não foi salvo
  if (!p.id) {
    if (!p.cliente?.nome) { toast('Informe o cliente antes de imprimir', 'danger'); return; }
    recalcularProposta(p);
    const saved = Store.propostas.add(p);
    Router.navigate('#/propostas/' + saved.id + '/print');
  } else {
    recalcularProposta(p);
    Store.propostas.update(p.id, p);
    Router.navigate('#/propostas/' + p.id + '/print');
  }
}

// ============================================
// Export / Import
// ============================================
function exportarTudo() {
  const json = Store.export();
  const ts = new Date().toISOString().slice(0,10);
  downloadFile(`precificador-backup-${ts}.json`, json, 'application/json');
  toast('Backup exportado');
}

function exportarInsumos() {
  const csv = ['codigo,descricao,categoria,unidade,preco,rendimento'];
  Store.insumos.list().forEach(i => {
    csv.push([
      i.codigo || '',
      `"${(i.descricao || '').replace(/"/g, '""')}"`,
      i.categoria || '',
      i.unidade || '',
      i.preco || 0,
      i.rendimento || 0
    ].join(','));
  });
  const ts = new Date().toISOString().slice(0,10);
  downloadFile(`insumos-${ts}.csv`, csv.join('\n'), 'text/csv;charset=utf-8');
  toast('Insumos exportados em CSV');
}

function importarTudo() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      if (Store.import(ev.target.result)) {
        toast('Dados importados com sucesso');
        Router.render();
      } else {
        toast('Arquivo inválido', 'danger');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ============================================
// Boot
// ============================================
async function init() {
  // Detecta configuração do Firebase
  const hasFirebase = window.firebaseConfig && window.firebaseConfig.apiKey;

  if (hasFirebase) {
    Store.mode = 'firebase';
    Store.load();   // inicializa state vazio
    renderLayout();
    bindGlobalActions();
    window.addEventListener('hashchange', () => Router.render());

    // Mostra splash de login enquanto Firebase carrega
    document.getElementById('content').innerHTML = `
      <div class="empty" style="padding:120px 24px">
        <div style="width:48px;height:48px;border:3px solid var(--bg-3);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 24px"></div>
        <h3>Conectando ao Firebase…</h3>
      </div>
      <style>@keyframes spin { to { transform: rotate(360deg); } }</style>`;

    try {
      await FB.init(window.firebaseConfig, onAuthChange);
    } catch (e) {
      console.error('Erro Firebase', e);
      document.getElementById('content').innerHTML = `
        <div class="alert warn" style="margin:48px auto;max-width:600px">
          <strong>Erro ao conectar com o Firebase:</strong> ${e.message}
          <br/><br/>Verifique a configuração no início do arquivo HTML.
        </div>`;
    }
  } else {
    // Modo local (localStorage)
    Store.mode = 'local';
    Store.load();
    renderLayout();
    bindGlobalActions();
    window.addEventListener('hashchange', () => Router.render());
    Router.render();
  }
}

function onAuthChange() {
  if (!FB.user) {
    // Não logado → mostra tela de login
    showLoginScreen();
    return;
  }
  if (!FB.userDoc) {
    // Logado mas erro ao criar/ler doc → mostra tela de erro
    showErrorScreen(FB._lastError || 'Erro desconhecido ao carregar seu perfil.');
    return;
  }
  if (!FB.userDoc.active) {
    // Logado mas pendente
    showPendingScreen();
    return;
  }
  // Logado e ativo → sincroniza dados e renderiza
  FB.syncAll((tipo) => {
    // Se o usuário está digitando num input/textarea/select, NÃO re-renderiza (evita perder foco)
    const ae = document.activeElement;
    const digitando = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT');
    if (digitando) {
      // marca pra re-renderizar quando o usuário sair do campo
      window._pendingRender = true;
      return;
    }
    Router.render();
    updateUserBadge();
  });

  // Quando o usuário sair de um campo (blur), aplica render pendente — listener uma vez só
  if (!window._focusOutBound) {
    window._focusOutBound = true;
    document.addEventListener('focusout', () => {
      setTimeout(() => {
        if (window._pendingRender && !document.activeElement?.tagName?.match(/INPUT|TEXTAREA|SELECT/)) {
          window._pendingRender = false;
          Router.render();
        }
      }, 100);
    }, true);
  }

  Router.render();
  updateUserBadge();
}
